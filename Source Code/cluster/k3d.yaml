apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: local-cloud
servers: 1
agents: 1
image: rancher/k3s:v1.28.2-k3s1
ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer
options:
  k3d:
    wait: true
    timeout: "120s"
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
