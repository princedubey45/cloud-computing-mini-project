apiVersion: v1
kind: Namespace
metadata:
  name: pipeline
---
apiVersion: batch/v1
kind: Job
metadata:
  name: teacher-worker-shard-0
  namespace: pipeline
spec:
  template:
    spec:
      containers:
        - name: worker
          image: localhost:5001/teacher-worker:latest
          env:
            - name: SHARD_INDEX
              value: "0"
            - name: SHARD_COUNT
              value: "2"
            - name: OLLAMA_HOST
              value: "http://ollama.pipeline.svc.cluster.local:11434"
      restartPolicy: Never
---
apiVersion: batch/v1
kind: Job
metadata:
  name: teacher-worker-shard-1
  namespace: pipeline
spec:
  template:
    spec:
      containers:
        - name: worker
          image: localhost:5001/teacher-worker:latest
          env:
            - name: SHARD_INDEX
              value: "1"
            - name: SHARD_COUNT
              value: "2"
            - name: OLLAMA_HOST
              value: "http://ollama.pipeline.svc.cluster.local:11434"
      restartPolicy: Never
