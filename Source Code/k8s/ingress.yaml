apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: command-parser-ingress
  namespace: app
  annotations:
    ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
spec:
  rules:
    - http:
        paths:
          - path: /parse
            pathType: Prefix
            backend:
              service:
                name: command-parser-svc
                port:
                  number: 8000
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: command-parser-svc
                port:
                  number: 8000
          - path: /readyz
            pathType: Prefix
            backend:
              service:
                name: command-parser-svc
                port:
                  number: 8000
